services:
  airflow:
    image: apache/airflow:2.10.4-python3.11
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data
      - ./warehouse:/opt/airflow/warehouse
    ports: ["8080:8080"]
    command: bash -c "pip install duckdb==1.1.3 dbt-core==1.9.1 dbt-duckdb==1.9.1 && airflow db migrate && airflow users create --username admin --password admin --firstname Data --lastname Engineer --role Admin --email admin@example.com || true; airflow webserver & airflow scheduler"
